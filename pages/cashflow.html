<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Income, Cashflow & Party Ledger - Digital Notebook</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <script>
        const savedTheme = localStorage.getItem('theme') || 'dark';
        if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html {
            scroll-behavior: smooth;
        }
        body { 
            font-family: 'Poppins', sans-serif; 
            touch-action: manipulation; 
            -webkit-overflow-scrolling: touch;
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.2); border-radius: 4px; }
    </style>
</head>

<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 p-2 md:p-4 pb-24 transition-colors duration-300 w-full m-0 min-h-screen flex flex-col justify-between">

<div class="space-y-3 w-full flex-1 max-w-4xl mx-auto">
    <!-- Header Section -->
    <div class="flex flex-col md:flex-row justify-between items-center bg-white dark:bg-slate-900 p-3.5 md:p-4 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 gap-3">
        <h1 class="text-sm md:text-lg font-bold tracking-wider text-slate-900 dark:text-white flex items-center gap-2">
            <span class="p-1.5 bg-slate-100 dark:bg-slate-800 rounded-lg text-emerald-500">📊</span> 
            <span>Cashflow & Ledger</span>
        </h1>
        
        <div class="flex flex-wrap items-center gap-2 w-full md:w-auto justify-end">
            <div class="flex flex-row items-center gap-1.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-2 py-1.5 rounded-lg text-xs overflow-x-auto max-w-full">
                <i class="fa-solid fa-calendar text-slate-400 shrink-0"></i>
                <input type="date" id="filter-from-date" onchange="applyGlobalFilters()" class="bg-transparent text-slate-900 dark:text-white outline-none shrink-0">
                <span class="text-slate-400 shrink-0">To</span>
                <input type="date" id="filter-to-date" onchange="applyGlobalFilters()" class="bg-transparent text-slate-900 dark:text-white outline-none shrink-0">
                <button onclick="clearDateFilter()" class="text-slate-400 hover:text-rose-500 ml-0.5 shrink-0"><i class="fa-solid fa-xmark"></i></button>
                <button type="button" onclick="exportToPDF()" class="bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 px-2.5 py-1 rounded-md text-xs font-semibold transition flex items-center gap-1 ml-1 shrink-0">
                    <i class="fa-solid fa-file-pdf text-rose-500"></i> PDF
                </button>
            </div>
        </div>
    </div>

    <!-- Summary Cards -->
    <div class="grid grid-cols-2 md:grid-cols-5 gap-2.5">
        <div class="bg-emerald-50 dark:bg-emerald-950/40 p-3 rounded-xl border border-emerald-200 dark:border-emerald-900/50">
            <p class="text-[10px] text-emerald-700 dark:text-emerald-400 font-bold uppercase tracking-wider">Total Income</p>
            <h2 id="summary-income" class="text-base md:text-lg font-extrabold text-emerald-800 dark:text-emerald-200 mt-0.5">Rs 0</h2>
        </div>
        <div class="bg-amber-50 dark:bg-amber-950/40 p-3 rounded-xl border border-amber-200 dark:border-amber-900/50">
            <p class="text-[10px] text-amber-700 dark:text-amber-400 font-bold uppercase tracking-wider">Total Cashflow</p>
            <h2 id="summary-cashflow" class="text-base md:text-lg font-extrabold text-amber-800 dark:text-amber-200 mt-0.5">Rs 0</h2>
        </div>
        <div class="bg-blue-50 dark:bg-blue-950/40 p-3 rounded-xl border border-blue-200 dark:border-blue-900/50">
            <p class="text-[10px] text-blue-700 dark:text-blue-400 font-bold uppercase tracking-wider">Expense (खर्च)</p>
            <h2 id="summary-expense" class="text-base md:text-lg font-extrabold text-blue-800 dark:text-blue-200 mt-0.5">Rs 0</h2>
        </div>
        <div class="bg-rose-50 dark:bg-rose-950/40 p-3 rounded-xl border border-rose-200 dark:border-rose-900/50">
            <p class="text-[10px] text-rose-700 dark:text-rose-400 font-bold uppercase tracking-wider">Receivable</p>
            <h2 id="summary-receivable" class="text-base md:text-lg font-extrabold text-rose-800 dark:text-rose-200 mt-0.5">Rs 0</h2>
        </div>
        <div class="bg-orange-50 dark:bg-orange-950/40 col-span-2 md:col-span-1 p-3 rounded-xl border border-orange-200 dark:border-orange-900/50">
            <p class="text-[10px] text-orange-700 dark:text-orange-400 font-bold uppercase tracking-wider">Payable</p>
            <h2 id="summary-payable" class="text-base md:text-lg font-extrabold text-orange-800 dark:text-orange-200 mt-0.5">Rs 0</h2>
        </div>
    </div>

    <!-- ACCORDION 1: ADD TRANSACTION -->
    <div class="bg-white dark:bg-slate-900 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden">
        <button onclick="toggleAccordion('section-transaction')" class="w-full flex justify-between items-center p-3.5 text-left font-bold text-xs text-slate-900 dark:text-white hover:bg-slate-50 dark:hover:bg-slate-800/50 transition">
            <span class="flex items-center gap-2"><i class="fa-solid fa-right-left text-blue-500"></i> Add New Transaction</span>
            <i id="icon-section-transaction" class="fa-solid fa-chevron-down transition-transform"></i>
        </button>
        <div id="content-section-transaction" class="hidden p-3.5 md:p-5 border-t border-slate-100 dark:border-slate-800 space-y-3">
            <form id="transaction-form" onsubmit="saveTransaction(event)" class="space-y-2.5">
                <input type="hidden" id="edit-txn-index" value="">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-0.5">Date</label>
                        <input type="date" id="txn-date" required class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-2.5 py-1.5 rounded-lg text-xs outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-0.5">Name</label>
                        <input type="text" id="txn-party" placeholder="Enter name" required class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-2.5 py-1.5 rounded-lg text-xs outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-0.5">Type</label>
                        <select id="txn-type" onchange="handleTypeChange()" class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-2.5 py-1.5 rounded-lg text-xs outline-none">
                            <option value="Receivable">Receivable (To Take)</option>
                            <option value="Payable">Payable (To Give)</option>
                            <option value="Expense">Expense (खर्च)</option>
                        </select>
                    </div>
                    <div id="interest-fields-wrapper" class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-400 mb-0.5">Monthly Interest (%)</label>
                            <input type="number" step="any" id="txn-interest-rate" value="0" oninput="calculateTotalAmount()" placeholder="Rate (%)" class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-2.5 py-1.5 rounded-lg text-xs outline-none">
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-400 mb-0.5">Period (Months)</label>
                            <input type="number" step="any" id="txn-period" value="0" oninput="calculateTotalAmount()" placeholder="Months" class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-2.5 py-1.5 rounded-lg text-xs outline-none">
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-0.5">Principal Amount (NPR / INR)</label>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="number" step="any" id="txn-amount-npr" oninput="calculateTotalAmount()" placeholder="NPR (Rs)" class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-2.5 py-1.5 rounded-lg text-xs outline-none">
                            <input type="number" step="any" id="txn-amount-inr" oninput="calculateTotalAmount()" placeholder="INR (₹)" class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-2.5 py-1.5 rounded-lg text-xs outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-0.5">Total Amount (NPR)</label>
                        <input type="text" id="txn-total-calc" readonly placeholder="Total calculation" class="w-full border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-800/80 text-slate-700 dark:text-slate-300 px-2.5 py-1.5 rounded-lg text-xs outline-none font-bold">
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 mb-0.5">Remarks / Note</label>
                    <input type="text" id="txn-note" placeholder="Optional details..." class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-2.5 py-1.5 rounded-lg text-xs outline-none">
                </div>

                <div class="flex gap-2 pt-1">
                    <button type="button" id="txn-cancel-btn" onclick="resetTxnForm()" class="hidden w-1/3 bg-slate-500 text-white p-2 rounded-lg text-xs">Cancel</button>
                    <button type="submit" id="txn-submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium p-2 rounded-lg text-xs transition">Save Transaction</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ACCORDION 2: PARTY ACCOUNTS & LEDGER -->
    <div class="bg-white dark:bg-slate-900 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden">
        <button onclick="toggleAccordion('section-party')" class="w-full flex justify-between items-center p-3.5 text-left font-bold text-xs text-slate-900 dark:text-white hover:bg-slate-50 dark:hover:bg-slate-800/50 transition">
            <span class="flex items-center gap-2"><i class="fa-solid fa-users text-purple-500"></i> Party Accounts & Ledger</span>
            <i id="icon-section-party" class="fa-solid fa-chevron-down transition-transform"></i>
        </button>
        <div id="content-section-party" class="hidden p-3.5 md:p-5 border-t border-slate-100 dark:border-slate-800 space-y-3">
            <input type="text" id="search-party" placeholder="Search party name..." oninput="renderPartyAccounts()" class="w-full md:w-64 border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-2.5 py-1.5 rounded-lg text-xs outline-none">
            <div id="party-list-container" class="space-y-2"></div>
        </div>
    </div>

    <!-- ACCORDION 3: ADD INCOME -->
    <div class="bg-white dark:bg-slate-900 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden">
        <button onclick="toggleAccordion('section-income')" class="w-full flex justify-between items-center p-3.5 text-left font-bold text-xs text-slate-900 dark:text-white hover:bg-slate-50 dark:hover:bg-slate-800/50 transition">
            <span class="flex items-center gap-2"><i class="fa-solid fa-wallet text-emerald-500"></i> Add Income Source</span>
            <i id="icon-section-income" class="fa-solid fa-chevron-down transition-transform"></i>
        </button>
        <div id="content-section-income" class="hidden p-3.5 md:p-5 border-t border-slate-100 dark:border-slate-800 space-y-3">
            <form id="income-form" onsubmit="saveIncome(event)" class="space-y-2.5">
                <input type="hidden" id="edit-income-index" value="">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-0.5">Source Name</label>
                        <input type="text" id="income-source-name" placeholder="Source Name" required class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-2.5 py-1.5 rounded-lg text-xs outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-0.5">Date</label>
                        <input type="date" id="income-date" required class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-2.5 py-1.5 rounded-lg text-xs outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-0.5">Amount (NPR / INR)</label>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="number" step="any" id="income-amount-npr" oninput="calculateIncomeTotal()" placeholder="NPR" class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-2.5 py-1.5 rounded-lg text-xs outline-none">
                            <input type="number" step="any" id="income-amount-inr" oninput="calculateIncomeTotal()" placeholder="INR" class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-2.5 py-1.5 rounded-lg text-xs outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-0.5">Total (NPR)</label>
                        <input type="text" id="income-total-calc" readonly placeholder="Total" class="w-full border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-800/80 text-slate-700 dark:text-slate-300 px-2.5 py-1.5 rounded-lg text-xs outline-none font-bold">
                    </div>
                </div>

                <div class="flex gap-2">
                    <button type="button" id="income-cancel-btn" onclick="resetIncomeForm()" class="hidden w-1/3 bg-slate-500 text-white p-2 rounded-lg text-xs">Cancel</button>
                    <button type="submit" id="income-submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium p-2 rounded-lg text-xs transition">Add Income</button>
                </div>
            </form>
            <div id="income-list-container" class="space-y-2 pt-2"></div>
            <div class="bg-slate-50 dark:bg-slate-800/50 p-2.5 rounded-lg border border-slate-200 dark:border-slate-700 flex justify-between items-center text-xs font-bold">
                <span>Total Income:</span>
                <span id="income-table-total" class="text-emerald-500">Rs 0</span>
            </div>
        </div>
    </div>

    <!-- ACCORDION 4: ADD CASHFLOW / SAVINGS -->
    <div class="bg-white dark:bg-slate-900 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden">
        <button onclick="toggleAccordion('section-savings')" class="w-full flex justify-between items-center p-3.5 text-left font-bold text-xs text-slate-900 dark:text-white hover:bg-slate-50 dark:hover:bg-slate-800/50 transition">
            <span class="flex items-center gap-2"><i class="fa-solid fa-piggy-bank text-amber-500"></i> Add Cashflow / Savings</span>
            <i id="icon-section-savings" class="fa-solid fa-chevron-down transition-transform"></i>
        </button>
        <div id="content-section-savings" class="hidden p-3.5 md:p-5 border-t border-slate-100 dark:border-slate-800 space-y-3">
            <form id="savings-form" onsubmit="saveSavings(event)" class="space-y-2.5">
                <input type="hidden" id="edit-savings-index" value="">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-2.5">
                    <div class="md:col-span-2">
                        <label class="block text-[11px] font-semibold text-slate-400 mb-0.5">Title</label>
                        <input type="text" id="savings-title" placeholder="Cashflow Title" required class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-2.5 py-1.5 rounded-lg text-xs outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-0.5">Category</label>
                        <select id="savings-category" class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white p-1.5 rounded-lg text-xs outline-none">
                            <option value="Bank">🏦 Bank</option>
                            <option value="Cash">💵 Cash</option>
                            <option value="Investment">📈 Investment</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-2.5">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-0.5">Amount (NPR/INR)</label>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="number" step="any" id="savings-amount-npr" oninput="calculateSavingsTotal()" placeholder="NPR" class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-2.5 py-1.5 rounded-lg text-xs outline-none">
                            <input type="number" step="any" id="savings-amount-inr" oninput="calculateSavingsTotal()" placeholder="INR" class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-2.5 py-1.5 rounded-lg text-xs outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-0.5">Total (NPR)</label>
                        <input type="text" id="savings-total-calc" readonly placeholder="Total" class="w-full border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-800/80 text-slate-700 dark:text-slate-300 px-2.5 py-1.5 rounded-lg text-xs outline-none font-bold">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-0.5">Date</label>
                        <input type="date" id="savings-date" required class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-2.5 py-1.5 rounded-lg text-xs outline-none">
                    </div>
                </div>

                <div class="flex gap-2">
                    <button type="button" id="savings-cancel-btn" onclick="resetSavingsForm()" class="hidden w-1/3 bg-slate-500 text-white p-2 rounded-lg text-xs">Cancel</button>
                    <button type="submit" id="savings-submit-btn" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-medium p-2 rounded-lg text-xs transition">Add Cashflow</button>
                </div>
            </form>
            <div id="savings-list-container" class="space-y-2 pt-2"></div>
            <div class="bg-slate-50 dark:bg-slate-800/50 p-2.5 rounded-lg border border-slate-200 dark:border-slate-700 flex justify-between items-center text-xs font-bold">
                <span>Total Cashflow:</span>
                <span id="savings-table-total" class="text-amber-500">Rs 0</span>
            </div>
        </div>
    </div>
</div>

<!-- Party Ledger Modal -->
<div id="ledger-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/70 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300 p-3">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4 w-full max-w-md shadow-2xl space-y-3 max-h-[90vh] overflow-y-auto">
        <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-800 pb-2">
            <h3 id="modal-party-title" class="text-xs font-bold text-slate-900 dark:text-white">Party Ledger</h3>
            <button onclick="closeLedgerModal()" class="text-slate-400 hover:text-rose-500 text-xs"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="modal-ledger-content" class="space-y-2 text-xs"></div>
        <div class="border-t border-slate-100 dark:border-slate-800 pt-2.5 space-y-2.5">
            <h4 class="font-bold text-xs text-slate-700 dark:text-slate-300">Settle / Payment</h4>
            <div class="grid grid-cols-2 gap-2">
                <input type="number" step="any" id="settle-amount" placeholder="Amount" class="border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-2.5 py-1.5 rounded-lg text-xs outline-none">
                <select id="settle-type" class="border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white px-2.5 py-1.5 rounded-lg text-xs outline-none">
                    <option value="Paid">Payment Given</option>
                    <option value="Received">Payment Received</option>
                </select>
            </div>
            <button onclick="recordPartialSettle()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white p-2 rounded-lg text-xs font-semibold">Save Payment</button>
        </div>
    </div>
</div>

<script>
    let transactions = JSON.parse(localStorage.getItem('my_transactions')) || [];
    let incomes = JSON.parse(localStorage.getItem('my_incomes')) || [];
    let savings = JSON.parse(localStorage.getItem('my_cashflow')) || [];
    let activePartyName = null;

    document.getElementById('txn-date').valueAsDate = new Date();
    document.getElementById('income-date').valueAsDate = new Date();
    document.getElementById('savings-date').valueAsDate = new Date();

    function saveData() {
        localStorage.setItem('my_transactions', JSON.stringify(transactions));
        localStorage.setItem('my_incomes', JSON.stringify(incomes));
        localStorage.setItem('my_cashflow', JSON.stringify(savings));
        refreshAll();
    }

    function toggleAccordion(sectionId) {
        const content = document.getElementById(`content-${sectionId}`);
        const icon = document.getElementById(`icon-${sectionId}`);
        content.classList.toggle('hidden');
        icon.classList.toggle('rotate-180');
    }

    function handleTypeChange() {
        const type = document.getElementById('txn-type').value;
        const interestWrapper = document.getElementById('interest-fields-wrapper');
        interestWrapper.style.display = (type === 'Expense') ? 'none' : 'grid';
        calculateTotalAmount();
    }

    function calculateTotalAmount() {
        const npr = parseFloat(document.getElementById('txn-amount-npr').value) || 0;
        const inr = parseFloat(document.getElementById('txn-amount-inr').value) || 0;
        const principal = npr + (inr * 1.6); 
        const rate = parseFloat(document.getElementById('txn-interest-rate').value) || 0;
        const period = parseFloat(document.getElementById('txn-period').value) || 0;

        const type = document.getElementById('txn-type').value;
        let total = principal;
        if (type !== 'Expense' && rate > 0 && period > 0) {
            total = principal + ((principal * rate * period) / 100);
        }
        document.getElementById('txn-total-calc').value = total > 0 ? `Rs ${total.toFixed(2)}` : '';
    }

    function calculateIncomeTotal() {
        const npr = parseFloat(document.getElementById('income-amount-npr').value) || 0;
        const inr = parseFloat(document.getElementById('income-amount-inr').value) || 0;
        const total = npr + (inr * 1.6);
        document.getElementById('income-total-calc').value = total > 0 ? `Rs ${total.toFixed(2)}` : '';
    }

    function calculateSavingsTotal() {
        const npr = parseFloat(document.getElementById('savings-amount-npr').value) || 0;
        const inr = parseFloat(document.getElementById('savings-amount-inr').value) || 0;
        const total = npr + (inr * 1.6);
        document.getElementById('savings-total-calc').value = total > 0 ? `Rs ${total.toFixed(2)}` : '';
    }

    function saveTransaction(e) {
        e.preventDefault();
        const date = document.getElementById('txn-date').value;
        const party = document.getElementById('txn-party').value.trim();
        const type = document.getElementById('txn-type').value;
        const npr = parseFloat(document.getElementById('txn-amount-npr').value) || 0;
        const inr = parseFloat(document.getElementById('txn-amount-inr').value) || 0;
        const principal = npr + (inr * 1.6);
        const rate = parseFloat(document.getElementById('txn-interest-rate').value) || 0;
        const period = parseFloat(document.getElementById('txn-period').value) || 0;
        
        let totalAmount = principal;
        if (type !== 'Expense' && rate > 0 && period > 0) {
            totalAmount = principal + ((principal * rate * period) / 100);
        }

        const note = document.getElementById('txn-note').value;
        const index = document.getElementById('edit-txn-index').value;
        const txnData = { date, party, type, npr, inr, principal, rate, period, amount: totalAmount, note };

        if(index === "") transactions.push(txnData);
        else transactions[index] = txnData;

        saveData();
        resetTxnForm();
        if(activePartyName) renderModalLedgerContent();
    }

    function editTransaction(index) {
        const t = transactions[index];
        document.getElementById('edit-txn-index').value = index;
        document.getElementById('txn-date').value = t.date;
        document.getElementById('txn-party').value = t.party;
        document.getElementById('txn-type').value = t.type;
        document.getElementById('txn-amount-npr').value = t.npr || 0;
        document.getElementById('txn-amount-inr').value = t.inr || 0;
        document.getElementById('txn-interest-rate').value = t.rate || 0;
        document.getElementById('txn-period').value = t.period || 0;
        document.getElementById('txn-note').value = t.note || '';
        
        handleTypeChange();
        calculateTotalAmount();
        document.getElementById('txn-submit-btn').innerText = "Update Transaction";
        document.getElementById('txn-cancel-btn').classList.remove('hidden');
        if(document.getElementById('content-section-transaction').classList.contains('hidden')) toggleAccordion('section-transaction');
    }

    function deleteTransaction(index) {
        if(confirm("Delete this transaction?")) {
            transactions.splice(index, 1);
            saveData();
            if(activePartyName) renderModalLedgerContent();
        }
    }

    function saveIncome(e) {
        e.preventDefault();
        const name = document.getElementById('income-source-name').value;
        const npr = parseFloat(document.getElementById('income-amount-npr').value) || 0;
        const inr = parseFloat(document.getElementById('income-amount-inr').value) || 0;
        const amount = npr + (inr * 1.6);
        const date = document.getElementById('income-date').value;
        const index = document.getElementById('edit-income-index').value;

        if(index === "") incomes.push({ name, npr, inr, amount, date });
        else incomes[index] = { name, npr, inr, amount, date };

        saveData();
        resetIncomeForm();
    }

    function editIncome(index) {
        const i = incomes[index];
        document.getElementById('edit-income-index').value = index;
        document.getElementById('income-source-name').value = i.name;
        document.getElementById('income-amount-npr').value = i.npr || i.amount;
        document.getElementById('income-amount-inr').value = i.inr || 0;
        document.getElementById('income-date').value = i.date;
        calculateIncomeTotal();
        document.getElementById('income-submit-btn').innerText = "Update Income";
        document.getElementById('income-cancel-btn').classList.remove('hidden');
    }

    function resetIncomeForm() {
        document.getElementById('income-form').reset();
        document.getElementById('edit-income-index').value = "";
        document.getElementById('income-date').valueAsDate = new Date();
        document.getElementById('income-total-calc').value = "";
        document.getElementById('income-submit-btn').innerText = "Add Income";
        document.getElementById('income-cancel-btn').classList.add('hidden');
    }

    function deleteIncome(index) {
        if(confirm("Delete this income?")) {
            incomes.splice(index, 1);
            saveData();
        }
    }

    function saveSavings(e) {
        e.preventDefault();
        const title = document.getElementById('savings-title').value;
        const category = document.getElementById('savings-category').value;
        const npr = parseFloat(document.getElementById('savings-amount-npr').value) || 0;
        const inr = parseFloat(document.getElementById('savings-amount-inr').value) || 0;
        const amount = npr + (inr * 1.6);
        const date = document.getElementById('savings-date').value;
        const index = document.getElementById('edit-savings-index').value;

        if(index === "") savings.push({ title, category, npr, inr, amount, date });
        else savings[index] = { title, category, npr, inr, amount, date };

        saveData();
        resetSavingsForm();
    }

    function editSavings(index) {
        const s = savings[index];
        document.getElementById('edit-savings-index').value = index;
        document.getElementById('savings-title').value = s.title;
        document.getElementById('savings-category').value = s.category;
        document.getElementById('savings-amount-npr').value = s.npr || s.amount;
        document.getElementById('savings-amount-inr').value = s.inr || 0;
        document.getElementById('savings-date').value = s.date;
        calculateSavingsTotal();
        document.getElementById('savings-submit-btn').innerText = "Update Cashflow";
        document.getElementById('savings-cancel-btn').classList.remove('hidden');
    }

    function resetSavingsForm() {
        document.getElementById('savings-form').reset();
        document.getElementById('edit-savings-index').value = "";
        document.getElementById('savings-date').valueAsDate = new Date();
        document.getElementById('savings-total-calc').value = "";
        document.getElementById('savings-submit-btn').innerText = "Add Cashflow";
        document.getElementById('savings-cancel-btn').classList.add('hidden');
    }

    function deleteSavings(index) {
        if(confirm("Delete this cashflow?")) {
            savings.splice(index, 1);
            saveData();
        }
    }

    function resetTxnForm() {
        document.getElementById('transaction-form').reset();
        document.getElementById('edit-txn-index').value = "";
        document.getElementById('txn-date').valueAsDate = new Date();
        document.getElementById('txn-total-calc').value = "";
        document.getElementById('txn-submit-btn').innerText = "Save Transaction";
        document.getElementById('txn-cancel-btn').classList.add('hidden');
        handleTypeChange();
    }

    function applyGlobalFilters() { refreshAll(); }
    function clearDateFilter() {
        document.getElementById('filter-from-date').value = '';
        document.getElementById('filter-to-date').value = '';
        refreshAll();
    }

    function getDateFilteredData(data) {
        const fromDate = document.getElementById('filter-from-date').value;
        const toDate = document.getElementById('filter-to-date').value;
        return data.filter(item => {
            if (fromDate && item.date < fromDate) return false;
            if (toDate && item.date > toDate) return false;
            return true;
        });
    }

    function refreshAll() {
        renderPartyAccounts();
        renderIncomeList();
        renderSavingsList();
        updateSummaryCards();
    }

    function updateSummaryCards() {
        const filteredTxns = getDateFilteredData(transactions);
        const filteredIncomes = getDateFilteredData(incomes);
        const filteredSavings = getDateFilteredData(savings);

        let receivable = 0, payable = 0, expense = 0;
        filteredTxns.forEach(t => {
            if(t.type === 'Receivable') receivable += t.amount;
            else if(t.type === 'Payable') payable += t.amount;
            else if(t.type === 'Expense') expense += t.amount;
        });

        let totalIncome = filteredIncomes.reduce((sum, i) => sum + i.amount, 0);
        let totalCashflow = filteredSavings.reduce((sum, s) => sum + s.amount, 0);

        document.getElementById('summary-income').innerText = 'Rs ' + totalIncome.toLocaleString();
        document.getElementById('summary-cashflow').innerText = 'Rs ' + totalCashflow.toLocaleString();
        document.getElementById('summary-expense').innerText = 'Rs ' + expense.toLocaleString();
        document.getElementById('summary-receivable').innerText = 'Rs ' + receivable.toLocaleString();
        document.getElementById('summary-payable').innerText = 'Rs ' + payable.toLocaleString();
    }

    function renderPartyAccounts() {
        const container = document.getElementById('party-list-container');
        const searchQuery = document.getElementById('search-party').value.toLowerCase();
        container.innerHTML = '';

        const partyMap = {};
        transactions.forEach((t) => {
            if(t.type === 'Expense') return;
            const cleanParty = t.party.trim();
            const lowerKey = cleanParty.toLowerCase();
            if(!partyMap[lowerKey]) partyMap[lowerKey] = { displayName: cleanParty, receivable: 0, payable: 0 };
            if(t.type === 'Receivable') partyMap[lowerKey].receivable += t.amount;
            else if(t.type === 'Payable') partyMap[lowerKey].payable += t.amount;
        });

        let partyKeys = Object.keys(partyMap).sort();
        if(searchQuery) partyKeys = partyKeys.filter(k => partyMap[k].displayName.toLowerCase().includes(searchQuery));

        if(partyKeys.length === 0) {
            container.innerHTML = `<p class="text-xs text-slate-400 text-center py-3">No party records found.</p>`;
            return;
        }

        partyKeys.forEach(key => {
            const data = partyMap[key];
            const net = data.receivable - data.payable;
            const netText = net >= 0 ? `To Take: Rs ${net.toLocaleString()}` : `To Give: Rs ${Math.abs(net).toLocaleString()}`;
            const badgeColor = net >= 0 ? 'text-emerald-500 bg-emerald-50 dark:bg-emerald-950/40' : 'text-rose-500 bg-rose-50 dark:bg-rose-950/40';

            container.innerHTML += `
                <div class="flex justify-between items-center p-2.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700/60 rounded-lg gap-2">
                    <div>
                        <h4 class="font-bold text-xs text-slate-900 dark:text-white">${data.displayName}</h4>
                        <p class="text-[10px] font-semibold mt-0.5 px-1.5 py-0.5 rounded inline-block ${badgeColor}">${netText}</p>
                    </div>
                    <button onclick="openLedgerModal('${data.displayName.replace(/'/g, "\\'")}')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-2.5 py-1 rounded-md text-xs font-medium transition">Ledger</button>
                </div>
            `;
        });
    }

    function openLedgerModal(party) {
        activePartyName = party;
        document.getElementById('modal-party-title').innerText = `Ledger: ${party}`;
        renderModalLedgerContent();
        const modal = document.getElementById('ledger-modal');
        modal.classList.remove('hidden');
        setTimeout(() => modal.classList.remove('opacity-0'), 10);
    }

    function closeLedgerModal() {
        const modal = document.getElementById('ledger-modal');
        modal.classList.add('opacity-0');
        setTimeout(() => modal.classList.add('hidden'), 300);
        activePartyName = null;
    }

    function renderModalLedgerContent() {
        const content = document.getElementById('modal-ledger-content');
        content.innerHTML = '';
        
        const partyTxns = [];
        transactions.forEach((t, idx) => {
            if(t.party && t.party.toLowerCase() === activePartyName.toLowerCase() && t.type !== 'Expense') {
                partyTxns.push({ ...t, originalIndex: idx });
            }
        });

        if(partyTxns.length === 0) {
            content.innerHTML = `<p class="text-slate-400">No transactions recorded.</p>`;
            return;
        }

        partyTxns.forEach((t) => {
            const isRec = t.type === 'Receivable';
            content.innerHTML += `
                <div class="flex justify-between items-center bg-slate-100 dark:bg-slate-800 p-2 rounded-lg">
                    <div>
                        <p class="font-semibold text-slate-900 dark:text-white">${t.date} - ${t.note || t.type}</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="font-bold ${isRec ? 'text-emerald-500' : 'text-rose-500'}">Rs ${t.amount.toLocaleString()}</span>
                        <button onclick="editTransaction(${t.originalIndex}); closeLedgerModal();" class="text-blue-500 p-1"><i class="fa-solid fa-pen text-xs"></i></button>
                        <button onclick="deleteTransaction(${t.originalIndex})" class="text-rose-500 p-1"><i class="fa-solid fa-trash text-xs"></i></button>
                    </div>
                </div>
            `;
        });
    }

    function recordPartialSettle() {
        const amount = parseFloat(document.getElementById('settle-amount').value);
        const type = document.getElementById('settle-type').value;
        if(!amount || amount <= 0) return;

        const txnType = type === 'Paid' ? 'Payable' : 'Receivable';
        transactions.push({
            party: activePartyName,
            type: txnType,
            amount: amount,
            date: new Date().toISOString().slice(0, 10),
            note: type === 'Paid' ? 'Payment Given' : 'Payment Received',
            npr: amount, inr: 0, rate: 0, period: 0
        });

        saveData();
        document.getElementById('settle-amount').value = '';
        renderModalLedgerContent();
    }

    function renderIncomeList() {
        const container = document.getElementById('income-list-container');
        container.innerHTML = '';
        const filtered = incomes.map((item, idx) => ({ ...item, originalIndex: idx }));
        const dateFiltered = getDateFilteredData(filtered);
        
        let totalIncomeSum = 0;
        dateFiltered.forEach(i => {
            totalIncomeSum += i.amount;
            container.innerHTML += `
                <div class="flex justify-between items-center bg-slate-50 dark:bg-slate-800/50 p-2 rounded-lg text-xs">
                    <div><span class="font-semibold">${i.name}</span> <span class="text-[10px] text-slate-400">(${i.date})</span></div>
                    <div class="flex items-center gap-2.5">
                        <span class="font-bold text-emerald-500">Rs ${i.amount.toLocaleString()}</span>
                        <button onclick="editIncome(${i.originalIndex})" class="text-blue-500"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deleteIncome(${i.originalIndex})" class="text-rose-500"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `;
        });
        document.getElementById('income-table-total').innerText = 'Rs ' + totalIncomeSum.toLocaleString();
    }

    function renderSavingsList() {
        const container = document.getElementById('savings-list-container');
        container.innerHTML = '';
        const filtered = savings.map((item, idx) => ({ ...item, originalIndex: idx }));
        const dateFiltered = getDateFilteredData(filtered);

        let totalSavingsSum = 0;
        dateFiltered.forEach(s => {
            totalSavingsSum += s.amount;
            container.innerHTML += `
                <div class="flex justify-between items-center bg-slate-50 dark:bg-slate-800/50 p-2 rounded-lg text-xs">
                    <div><span class="font-semibold">${s.title}</span> <span class="text-[10px] px-1 bg-amber-100 dark:bg-amber-950 text-amber-600 rounded">${s.category}</span></div>
                    <div class="flex items-center gap-2.5">
                        <span class="font-bold text-amber-500">Rs ${s.amount.toLocaleString()}</span>
                        <button onclick="editSavings(${s.originalIndex})" class="text-blue-500"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deleteSavings(${s.originalIndex})" class="text-rose-500"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `;
        });
        document.getElementById('savings-table-total').innerText = 'Rs ' + totalSavingsSum.toLocaleString();
    }

    function exportToPDF() {
        const printWindow = window.open('', '_blank');
        let html = `<html><head><title>Report</title><style>body{font-family:sans-serif;padding:20px;}table{width:100%;border-collapse:collapse;margin-top:10px;}th,td{border:1px solid #ddd;padding:6px;text-align:left;font-size:12px;}th{background:#f4f4f4;}</style></head><body>`;
        html += `<h2>Financial Report</h2><table><tr><th>Date</th><th>Name</th><th>Type</th><th>Amount</th></tr>`;
        transactions.forEach(t => {
            html += `<tr><td>${t.date}</td><td>${t.party}</td><td>${t.type}</td><td>${t.amount}</td></tr>`;
        });
        html += `</table></body></html>`;
        printWindow.document.write(html);
        printWindow.document.close();
        printWindow.print();
    }

    refreshAll();
</script>

</body>
</html>
