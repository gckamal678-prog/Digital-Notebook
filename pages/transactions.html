<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Protected Ledger - Secure QR</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- HTML5 QR Code Scanner Library for real camera & gallery upload -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen">

    <div class="bg-slate-800 p-5 rounded-2xl shadow-xl w-full max-w-xs border border-slate-700">
        <!-- Toggle Tabs -->
        <div class="flex bg-slate-900 p-1 rounded-xl mb-4">
            <button id="tabGenerate" onclick="switchTab('generate')" class="flex-1 py-1.5 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition-all">Generate</button>
            <button id="tabScan" onclick="switchTab('scan')" class="flex-1 py-1.5 text-xs font-semibold rounded-lg text-slate-400 transition-all">Scan</button>
        </div>

        <!-- 1. Generate Section -->
        <div id="generateSection" class="space-y-3">
            <div class="text-center bg-slate-900 p-3 rounded-xl border border-slate-700 relative">
                <div id="qrcodeWrapper" class="relative inline-block bg-white p-2 rounded-lg">
                    <div id="qrcode" class="flex items-center justify-center min-h-[130px] min-w-[130px]">
                        <span class="text-[11px] text-slate-400">QR will appear here</span>
                    </div>
                    <!-- Center Circular Image -->
                    <div id="centerLogo" class="absolute inset-0 m-auto w-10 h-10 rounded-full border-2 border-white bg-slate-200 overflow-hidden hidden shadow-md flex items-center justify-center">
                        <img src="N1512.png" alt="Family" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/40'">
                    </div>
                </div>
                <div id="timerDisplay" class="text-[11px] text-amber-400 font-mono mt-2 hidden">Expires in: <span id="countdown">02:00</span></div>
            </div>
            
            <button onclick="generateSecureQR()" class="w-full bg-indigo-600 hover:bg-indigo-500 py-2 rounded-xl text-xs font-medium transition-all">Generate QR</button>
            
            <!-- Share Family Button -->
            <button onclick="shareFamilyQR()" id="shareBtn" class="w-full bg-slate-700 hover:bg-slate-600 py-2 rounded-xl text-xs font-medium transition-all flex items-center justify-center space-x-2 hidden">
                <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
                <span>Share Your Family</span>
            </button>
        </div>

        <!-- 2. Scan Section -->
        <div id="scanSection" class="space-y-3 hidden">
            <!-- Camera Viewport -->
            <div class="relative bg-black rounded-xl overflow-hidden h-[140px] flex items-center justify-center border border-slate-700">
                <div id="reader" class="w-full h-full"></div>
                <div id="scannerPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center text-center p-2">
                    <svg class="w-6 h-6 text-slate-500 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path></svg>
                    <span class="text-[10px] text-slate-400">Camera is off</span>
                </div>
            </div>

            <!-- Scanner Controls -->
            <div class="flex space-x-2">
                <button onclick="startRealScanner()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 py-1.5 rounded-xl text-xs font-medium transition-all">Start Scan</button>
                <button onclick="stopRealScanner()" class="bg-rose-600 hover:bg-rose-500 px-3 py-1.5 rounded-xl text-xs font-medium transition-all">Stop</button>
            </div>

            <!-- Gallery Upload Option -->
            <label class="w-full bg-slate-700 hover:bg-slate-600 py-1.5 rounded-xl text-xs font-medium transition-all flex items-center justify-center space-x-2 cursor-pointer">
                <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                <span>From Gallery</span>
                <input type="file" id="qrFileInput" accept="image/*" class="hidden" onchange="scanImageFromFile(event)">
            </label>

            <!-- Manual Token Input Section -->
            <div class="flex space-x-1 pt-1">
                <input type="text" id="manualTokenInput" placeholder="Type token here..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-1.5 text-[11px] text-white focus:outline-none focus:border-indigo-500">
                <button onclick="verifyManualToken()" class="bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 rounded-xl text-xs font-medium transition-all">OK</button>
            </div>
        </div>

        <!-- Feedback Message Box -->
        <div id="feedbackMsg" class="mt-3 p-2 rounded-xl text-[11px] text-center hidden"></div>
        <!-- Scan Result Display -->
        <div id="scanResult" class="mt-2 p-2 bg-slate-900 rounded-xl text-[11px] text-indigo-300 text-center hidden"></div>
    </div>

    <script>
        let timerInterval;
        let html5QrCode;
        let lastGeneratedToken = "";

        function switchTab(mode) {
            const genSec = document.getElementById('generateSection');
            const scanSec = document.getElementById('scanSection');
            const tabGen = document.getElementById('tabGenerate');
            const tabScan = document.getElementById('tabScan');
            const feedback = document.getElementById('feedbackMsg');
            feedback.classList.add('hidden');

            if (mode === 'generate') {
                genSec.classList.remove('hidden');
                scanSec.classList.add('hidden');
                tabGen.className = "flex-1 py-1.5 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition-all";
                tabScan.className = "flex-1 py-1.5 text-xs font-semibold rounded-lg text-slate-400 transition-all";
                stopRealScanner();
            } else {
                genSec.classList.add('hidden');
                scanSec.classList.remove('hidden');
                tabScan.className = "flex-1 py-1.5 text-xs font-semibold rounded-lg bg-emerald-600 text-white transition-all";
                tabGen.className = "flex-1 py-1.5 text-xs font-semibold rounded-lg text-slate-400 transition-all";
            }
        }

        function generateSecureQR() {
            const qrcodeContainer = document.getElementById('qrcode');
            qrcodeContainer.innerHTML = ""; 
            
            const currentUserId = "user_id";
            const uniqueHash = Math.random().toString(36).substring(2, 9) + Math.random().toString(36).substring(2, 9);
            const secureToken = `LEDGER_${currentUserId}_${Date.now()}_${uniqueHash}`;
            
            lastGeneratedToken = secureToken;

            new QRCode(qrcodeContainer, {
                text: secureToken,
                width: 130,
                height: 130,
                correctLevel: QRCode.CorrectLevel.H
            });

            document.getElementById('centerLogo').classList.remove('hidden');
            document.getElementById('shareBtn').classList.remove('hidden');

            startCountdown(120);
            showFeedback("QR Generated Successfully!", "success");
        }

        function startCountdown(duration) {
            clearInterval(timerInterval);
            let timer = duration, minutes, seconds;
            const timerDisplay = document.getElementById('timerDisplay');
            const countdownEl = document.getElementById('countdown');
            timerDisplay.classList.remove('hidden');

            timerInterval = setInterval(function () {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);

                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                countdownEl.textContent = minutes + ":" + seconds;

                if (--timer < 0) {
                    clearInterval(timerInterval);
                    document.getElementById('qrcode').innerHTML = '<span class="text-[11px] text-red-400 font-semibold">Expired!</span>';
                    document.getElementById('centerLogo').classList.add('hidden');
                    timerDisplay.classList.add('hidden');
                    document.getElementById('shareBtn').classList.add('hidden');
                    showFeedback("QR Expired due to security.", "error");
                }
            }, 1000);
        }

        async function shareFamilyQR() {
            if (!lastGeneratedToken) {
                alert("Please generate QR first!");
                return;
            }

            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'Family Protected Ledger Token',
                        text: `My Family Protected Ledger secure token is: ${lastGeneratedToken}`
                    });
                } catch (err) {
                    console.log('Sharing failed', err);
                }
            } else {
                navigator.clipboard.writeText(lastGeneratedToken);
                alert("Token copied to clipboard!");
            }
        }

        function startRealScanner() {
            const placeholder = document.getElementById('scannerPlaceholder');
            placeholder.style.display = 'none';
            
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 100, height: 100 } },
                (decodedText) => {
                    handleScanSuccess(decodedText);
                    stopRealScanner();
                },
                (errorMessage) => {}
            ).catch((err) => {
                showFeedback("Cannot open camera.", "error");
                placeholder.style.display = 'flex';
            });
        }

        function stopRealScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    document.getElementById('scannerPlaceholder').style.display = 'flex';
                }).catch(err => console.log(err));
            } else {
                document.getElementById('scannerPlaceholder').style.display = 'flex';
            }
        }

        function scanImageFromFile(e) {
            if (e.target.files.length === 0) return;
            const imageFile = e.target.files[0];
            
            const html5QrCodeFromFile = new Html5Qrcode("reader");
            html5QrCodeFromFile.scanFile(imageFile, true)
                .then(decodedText => {
                    handleScanSuccess(decodedText);
                })
                .catch(err => {
                    showFeedback("No valid QR found in image!", "error");
                });
        }

        function verifyManualToken() {
            const token = document.getElementById('manualTokenInput').value.trim();
            if (!token) {
                showFeedback("Please type a token!", "error");
                return;
            }
            handleScanSuccess(token);
        }

        function handleScanSuccess(text) {
            const resDiv = document.getElementById('scanResult');
            resDiv.classList.remove('hidden');
            resDiv.textContent = "Success: " + text;
            showFeedback("QR/Token Verification Successful!", "success");
        }

        function showFeedback(message, type) {
            const fb = document.getElementById('feedbackMsg');
            fb.classList.remove('hidden', 'bg-emerald-950', 'text-emerald-300', 'bg-red-950', 'text-red-300');
            if (type === 'success') {
                fb.classList.add('bg-emerald-950', 'text-emerald-300');
            } else {
                fb.classList.add('bg-red-950', 'text-red-300');
            }
            fb.textContent = message;

            setTimeout(() => {
                fb.classList.add('hidden');
            }, 3000);
        }
    </script>
</body>
</html>
