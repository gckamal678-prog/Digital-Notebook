<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Protected Ledger - Secure QR</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen">

    <div class="bg-slate-800 p-5 rounded-2xl shadow-xl w-full max-w-xs border border-slate-700">
        <!-- टगल ट्याबहरू -->
        <div class="flex bg-slate-900 p-1 rounded-xl mb-4">
            <button id="tabGenerate" onclick="switchTab('generate')" class="flex-1 py-1.5 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition-all">जेनेरेट</button>
            <button id="tabScan" onclick="switchTab('scan')" class="flex-1 py-1.5 text-xs font-semibold rounded-lg text-slate-400 transition-all">स्क्यान</button>
        </div>

        <!-- १. जेनेरेट सेक्सन -->
        <div id="generateSection" class="space-y-3">
            <div class="text-center bg-slate-900 p-3 rounded-xl border border-slate-700">
                <div id="qrcode" class="bg-white p-2 rounded-lg inline-block min-h-[140px] min-w-[140px] flex items-center justify-center text-slate-900">
                    <span class="text-[11px] text-slate-400">QR यहाँ देखिनेछ</span>
                </div>
                <div id="timerDisplay" class="text-[11px] text-amber-400 font-mono mt-2 hidden">म्याद सकिन बाँकी: <span id="countdown">02:00</span></div>
            </div>
            <button onclick="generateSecureQR()" class="w-full bg-indigo-600 hover:bg-indigo-500 py-2 rounded-xl text-xs font-medium transition-all">सुरक्षित QR बनाउनुहोस्</button>
        </div>

        <!-- २. स्क्यान सेक्सन (बीचमा राउण्ड फोटो सहित) -->
        <div id="scanSection" class="space-y-3 hidden">
            <div class="relative bg-black rounded-xl overflow-hidden h-[156px] flex items-center justify-center border border-slate-700">
                <!-- वास्तविक क्यामेरा भिडियो स्ट्रिम देखाउनको लागि -->
                <video id="cameraStream" class="absolute inset-0 w-full h-full object-cover hidden" autoplay playsinline></video>
                
                <!-- बीचमा रूट (Root) बाट फोटो राख्ने (Round) -->
                <div class="absolute z-10 w-12 h-12 rounded-full border-2 border-indigo-500 overflow-hidden bg-slate-800 flex items-center justify-center shadow-lg">
                    <img src="N1024.png" alt="Profile" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/48'">
                </div>

                <div id="scannerView" class="text-center p-2 z-0">
                    <span class="text-[11px] text-slate-400">स्क्यानिङ क्यामेरा बन्द छ</span>
                </div>
            </div>
            
            <div class="flex gap-2">
                <button onclick="startRealCamera()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 py-2 rounded-xl text-xs font-medium transition-all">क्यामेरा खोल्नुहोस्</button>
                <!-- ग्यालरीबाट लोड गर्ने बटन -->
                <label class="flex-1 bg-slate-700 hover:bg-slate-600 py-2 rounded-xl text-xs font-medium text-center cursor-pointer transition-all flex items-center justify-center">
                    ग्यालरीबाट लोड
                    <input type="file" accept="image/*" class="hidden" onchange="loadFromGallery(event)">
                </label>
            </div>
        </div>

        <!-- ३. प्रतिक्रिया सन्देश र सेयर बटन सेक्सन -->
        <div id="feedbackContainer" class="mt-3 hidden">
            <div id="feedbackMsg" class="p-2 rounded-xl text-[11px] text-center mb-2"></div>
            <button id="shareBtn" onclick="shareQRData()" class="w-full bg-sky-600 hover:bg-sky-500 py-1.5 rounded-xl text-xs font-medium transition-all hidden flex items-center justify-center gap-1">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
                QR सेयर गर्नुहोस्
            </button>
        </div>
    </div>

    <script>
        let timerInterval;
        let currentToken = "";

        function switchTab(mode) {
            const genSec = document.getElementById('generateSection');
            const scanSec = document.getElementById('scanSection');
            const tabGen = document.getElementById('tabGenerate');
            const tabScan = document.getElementById('tabScan');
            document.getElementById('feedbackContainer').classList.add('hidden');

            // ट्याब फेर्दा क्यामेरा बन्द गर्ने
            stopCamera();

            if (mode === 'generate') {
                genSec.classList.remove('hidden');
                scanSec.classList.add('hidden');
                tabGen.className = "flex-1 py-1.5 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition-all";
                tabScan.className = "flex-1 py-1.5 text-xs font-semibold rounded-lg text-slate-400 transition-all";
            } else {
                genSec.classList.add('hidden');
                scanSec.classList.remove('hidden');
                tabScan.className = "flex-1 py-1.5 text-xs font-semibold rounded-lg bg-emerald-600 text-white transition-all";
                tabGen.className = "flex-1 py-1.5 text-xs font-semibold rounded-lg text-slate-400 transition-all";
            }
        }

        function generateSecureQR() {
            const qrcodeContainer = document.getElementById('qrcode');
            qrcodeContainer.innerHTML = ""; 
            
            currentToken = "ENC_TOKEN_" + Math.random().toString(36).substring(2, 9) + "_" + Date.now();
            
            new QRCode(qrcodeContainer, {
                text: currentToken,
                width: 130,
                height: 130
            });

            startCountdown(120);
            showFeedback("QR कोड सफलताપूर्वक जेनेरेट भयो!", "success", true);
        }

        function startCountdown(duration) {
            clearInterval(timerInterval);
            let timer = duration, minutes, seconds;
            const timerDisplay = document.getElementById('timerDisplay');
            const countdownEl = document.getElementById('countdown');
            timerDisplay.classList.remove('hidden');

            timerInterval = setInterval(function () {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);

                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                countdownEl.textContent = minutes + ":" + seconds;

                if (--timer < 0) {
                    clearInterval(timerInterval);
                    document.getElementById('qrcode').innerHTML = '<span class="text-[11px] text-red-400 font-semibold">म्याद समाप्त भयो!</span>';
                    timerDisplay.classList.add('hidden');
                    showFeedback("सुरक्षाका कारण QR को म्याद सकियो।", "error", false);
                }
            }, 1000);
        }

        // वास्तविक क्यामेरा सुरु गर्ने फंक्सन
        async function startRealCamera() {
            const video = document.getElementById('cameraStream');
            const scannerView = document.getElementById('scannerView');
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = stream;
                video.classList.remove('hidden');
                scannerView.innerHTML = '';
                showFeedback("वास्तविक क्यामेरा चालु भयो।", "success", false);
            } catch (err) {
                showFeedback("क्यामेरा अनुमति मिलेन वा उपलब्ध छैन।", "error", false);
            }
        }

        function stopCamera() {
            const video = document.getElementById('cameraStream');
            if (video.srcObject) {
                let tracks = video.srcObject.getTracks();
                tracks.forEach(track => track.stop());
                video.srcObject = null;
                video.classList.add('hidden');
            }
        }

        // ग्यालरीबाट फोटो लोड गर्ने फंक्सन
        function loadFromGallery(event) {
            const file = event.target.files[0];
            if (file) {
                showFeedback("ग्यालरीबाट फाइल सफल रूपमा लोड भयो। स्क्यान गर्दै...", "success", false);
                // यहाँ ग्यालरीको इमेज डिकोड गर्ने लजिक थप्न सकिन्छ
            }
        }

        function shareQRData() {
            if (navigator.share) {
                navigator.share({
                    title: 'Family Protected Ledger',
                    text: 'मेरो सुरक्षित QR टोकन: ' + currentToken,
                }).catch((error) => console.log('Sharing failed', error));
            } else {
                alert("तपाईको ब्राउजरमा सेयर फिचर उपलब्ध छैन। टोकन: " + currentToken);
            }
        }

        function showFeedback(message, type, showShare) {
            const container = document.getElementById('feedbackContainer');
            const fb = document.getElementById('feedbackMsg');
            const shareBtn = document.getElementById('shareBtn');
            
            container.classList.remove('hidden');
            fb.className = "p-2 rounded-xl text-[11px] text-center mb-2 " + (type === 'success' ? 'bg-emerald-950 text-emerald-300' : 'bg-red-950 text-red-300');
            fb.textContent = message;

            if (showShare) {
                shareBtn.classList.remove('hidden');
            } else {
                shareBtn.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
