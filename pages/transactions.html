<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Protected Ledger - Secure QR</title>
    <!-- Tailwind CSS (तुरुन्तै टेस्ट गर्नको लागि CDN प्रयोग गरिएको छ) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen">

    <div class="bg-slate-800 p-5 rounded-2xl shadow-xl w-full max-w-xs border border-slate-700">
        <!-- टगल ट्याबहरू (जेनेरेट र स्क्यान एकै ठाउँमा) -->
        <div class="flex bg-slate-900 p-1 rounded-xl mb-4">
            <button id="tabGenerate" onclick="switchTab('generate')" class="flex-1 py-1.5 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition-all">जेनेरेट</button>
            <button id="tabScan" onclick="switchTab('scan')" class="flex-1 py-1.5 text-xs font-semibold rounded-lg text-slate-400 transition-all">स्क्यान</button>
        </div>

        <!-- १. जेनेरेट सेक्सन -->
        <div id="generateSection" class="space-y-3">
            <div class="text-center bg-slate-900 p-3 rounded-xl border border-slate-700">
                <div id="qrcode" class="bg-white p-2 rounded-lg inline-block min-h-[140px] min-w-[140px] flex items-center justify-center text-slate-900">
                    <span class="text-[11px] text-slate-400">QR यहाँ देखिनेछ</span>
                </div>
                <div id="timerDisplay" class="text-[11px] text-amber-400 font-mono mt-2 hidden">म्याद सकिन बाँकी: <span id="countdown">02:00</span></div>
            </div>
            <button onclick="generateSecureQR()" class="w-full bg-indigo-600 hover:bg-indigo-500 py-2 rounded-xl text-xs font-medium transition-all">सुरक्षित QR बनाउनुहोस्</button>
        </div>

        <!-- २. स्क्यान सेक्सन (साझा भ्युपोर्ट फ्रेम) -->
        <div id="scanSection" class="space-y-3 hidden">
            <div class="relative bg-black rounded-xl overflow-hidden h-[156px] flex items-center justify-center border border-slate-700">
                <!-- क्यामेरा वा स्क्यानिङ भ्यु -->
                <div id="scannerView" class="text-center p-2">
                    <svg class="w-8 h-8 mx-auto text-slate-500 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path></svg>
                    <span class="text-[11px] text-slate-400">स्क्यानिङ क्यामेरा बन्द छ</span>
                </div>
            </div>
            <button onclick="startScanner()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-2 rounded-xl text-xs font-medium transition-all">स्क्यानिङ सुरु गर्नुहोस्</button>
        </div>

        <!-- ३. प्रतिक्रिया सन्देश (Feedback Alert) -->
        <div id="feedbackMsg" class="mt-3 p-2 rounded-xl text-[11px] text-center hidden"></div>
    </div>

    <script>
        let timerInterval;

        function switchTab(mode) {
            const genSec = document.getElementById('generateSection');
            const scanSec = document.getElementById('scanSection');
            const tabGen = document.getElementById('tabGenerate');
            const tabScan = document.getElementById('tabScan');
            const feedback = document.getElementById('feedbackMsg');
            feedback.classList.add('hidden');

            if (mode === 'generate') {
                genSec.classList.remove('hidden');
                scanSec.classList.add('hidden');
                tabGen.className = "flex-1 py-1.5 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition-all";
                tabScan.className = "flex-1 py-1.5 text-xs font-semibold rounded-lg text-slate-400 transition-all";
            } else {
                genSec.classList.add('hidden');
                scanSec.classList.remove('hidden');
                tabScan.className = "flex-1 py-1.5 text-xs font-semibold rounded-lg bg-emerald-600 text-white transition-all";
                tabGen.className = "flex-1 py-1.5 text-xs font-semibold rounded-lg text-slate-400 transition-all";
            }
        }

        function generateSecureQR() {
            const qrcodeContainer = document.getElementById('qrcode');
            qrcodeContainer.innerHTML = ""; 
            
            // इन्क्रिप्टेड टोकन सिर्जना
            const secureToken = "ENC_TOKEN_" + Math.random().toString(36).substring(2, 9) + "_" + Date.now();
            
            // QR कोड जेनेरेट गर्ने
            new QRCode(qrcodeContainer, {
                text: secureToken,
                width: 130,
                height: 130
            });

            // ठ ακ २ मिनेट (१२० सेकेन्ड) को काउन्टडाउन सुरु गर्ने
            startCountdown(120);
            showFeedback("QR कोड सफलताપूर्वक जेनेरेट भयो!", "success");
        }

        function startCountdown(duration) {
            clearInterval(timerInterval);
            let timer = duration, minutes, seconds;
            const timerDisplay = document.getElementById('timerDisplay');
            const countdownEl = document.getElementById('countdown');
            timerDisplay.classList.remove('hidden');

            timerInterval = setInterval(function () {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);

                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                countdownEl.textContent = minutes + ":" + seconds;

                if (--timer < 0) {
                    clearInterval(timerInterval);
                    document.getElementById('qrcode').innerHTML = '<span class="text-[11px] text-red-400 font-semibold">म्याद समाप्त भयो!</span>';
                    timerDisplay.classList.add('hidden');
                    showFeedback("सुरक्षाका कारण QR को म्याद सकियो।", "error");
                }
            }, 1000);
        }

        function startScanner() {
            const scannerView = document.getElementById('scannerView');
            scannerView.innerHTML = '<span class="text-[11px] text-emerald-400 animate-pulse">क्यामेरा कनेक्ट हुँदैछ...</span>';
            showFeedback("स्क्यानिङ मोड सक्रिय भयो।", "success");
        }

        function showFeedback(message, type) {
            const fb = document.getElementById('feedbackMsg');
            fb.classList.remove('hidden', 'bg-emerald-950', 'text-emerald-300', 'bg-red-950', 'text-red-300');
            if (type === 'success') {
                fb.classList.add('bg-emerald-950', 'text-emerald-300');
            } else {
                fb.classList.add('bg-red-950', 'text-red-300');
            }
            fb.textContent = message;
        }
    </script>
</body>
</html>
