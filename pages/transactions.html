<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Ledger & QR Sync</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QRCode Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- HTML5 QR Scanner -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- Cropper.js for Gallery Zoom/Crop -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen font-sans">

    <!-- FEEDBACK TOAST -->
    <div id="feedbackMsg" class="hidden fixed top-4 left-1/2 transform -translate-x-1/2 z-50 px-4 py-2 rounded-lg text-xs font-bold shadow-lg transition-all"></div>

    <!-- MAIN APP CONTAINER -->
    <div class="max-w-md mx-auto min-h-screen flex flex-col bg-gray-900 shadow-2xl">

        <!-- HEADER: Scan Or Share Top Bar -->
        <div class="bg-red-800 text-white p-4 flex items-center shadow-md">
            <h1 class="text-lg font-bold tracking-wide">Scan Or Share</h1>
        </div>

        <!-- TOGGLE SWITCH (Scan / Share) -->
        <div class="p-4 bg-gray-900">
            <div class="bg-black/40 p-1 rounded-xl flex border border-gray-800">
                <button onclick="switchTab('scan')" id="scanTabBtn" class="flex-1 py-2.5 rounded-lg font-bold text-sm transition text-red-500 bg-white shadow">
                    Scan
                </button>
                <button onclick="switchTab('share')" id="shareTabBtn" class="flex-1 py-2.5 rounded-lg font-bold text-sm transition text-gray-400">
                    Share
                </button>
            </div>
        </div>

        <!-- CONTENT SECTION -->
        <div class="flex-1 p-4 overflow-y-auto">

            <!-------------------------------------------------->
            <!-- VIEW 1: SCAN TAB (Camera, Torch, Gallery) -->
            <!-------------------------------------------------->
            <div id="scanView" class="space-y-4">
                
                <!-- Utilities Toolbar (Flashlight & Gallery) -->
                <div class="bg-gray-800/80 border border-gray-700/50 rounded-xl p-3 flex justify-around items-center">
                    <button onclick="toggleTorch()" class="flex flex-col items-center gap-1 text-gray-300 hover:text-white transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                        <span class="text-[10px]">Flash</span>
                    </button>
                    <div class="h-8 w-[1px] bg-gray-700"></div>
                    <button onclick="document.getElementById('fileInput').click()" class="flex flex-col items-center gap-1 text-gray-300 hover:text-white transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                        <span class="text-[10px]">Gallery</span>
                    </button>
                </div>

                <!-- Hidden Input for Gallery -->
                <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="scanImageFromFile(event)">

                <!-- Scanner Viewfinder Box -->
                <div class="bg-black border-2 border-dashed border-gray-700 rounded-2xl p-4 text-center relative overflow-hidden min-h-[300px] flex flex-col justify-center items-center">
                    <div id="reader" class="w-full rounded-lg overflow-hidden"></div>
                    
                    <div id="scannerPlaceholder" class="flex flex-col items-center justify-center p-6 text-gray-400">
                        <p class="text-sm font-medium">Camera is inactive</p>
                        <button onclick="startRealScanner()" class="mt-3 bg-red-600 hover:bg-red-700 text-white px-5 py-2 rounded-xl text-xs font-bold transition">
                            Start Camera
                        </button>
                    </div>
                    
                    <div id="scannerLoading" class="hidden text-yellow-400 text-xs font-medium animate-pulse mt-2">
                        Initializing camera...
                    </div>
                </div>

                <!-- Scanner Stop Control -->
                <button onclick="stopRealScanner()" class="w-full bg-gray-800 hover:bg-gray-700 py-2.5 rounded-xl text-xs font-bold text-gray-300 transition">
                    Stop Camera
                </button>
            </div>

            <!-------------------------------------------------->
            <!-- VIEW 2: SHARE TAB (Profile Card & QR View) -->
            <!-------------------------------------------------->
            <div id="shareView" class="space-y-4 hidden">
                
                <!-- Profile Header Card (Bank Style) -->
                <div class="bg-white text-gray-900 rounded-2xl p-4 shadow-lg relative flex justify-between items-center">
                    <div>
                        <div class="flex items-center gap-2">
                            <h3 id="profileName" class="text-base font-extrabold tracking-tight">Kamal G.C.</h3>
                            <span class="bg-red-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">Primary</span>
                        </div>
                        <p id="profilePhone" class="text-xs text-gray-500 mt-0.5">+977 9800000000</p>
                        <p id="profileEmail" class="text-xs text-gray-500">kamal@gmail.com</p>
                    </div>
                    <!-- Direct Native Share Icon -->
                    <button onclick="openNativeShareSheet()" class="p-2.5 bg-gray-100 hover:bg-gray-200 rounded-full transition text-gray-800">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
                    </button>
                </div>

                <!-- QR Display Card -->
                <div class="bg-white rounded-2xl p-6 shadow-xl flex flex-col items-center text-center">
                    <div id="qrcode" class="p-3 bg-white rounded-xl shadow-inner inline-block border border-gray-100 mb-4"></div>
                    <p class="text-xs text-gray-500 font-medium">Scan this QR to securely link & sync ledger data.</p>
                </div>

            </div>

        </div>
    </div>

    <!-- CROPPER MODAL (For Gallery Photos) -->
    <div id="cropperModal" style="display:none;" class="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-800 p-4 rounded-2xl max-w-sm w-full text-white shadow-2xl">
            <h3 class="text-sm font-bold mb-1 text-red-500">Crop & Zoom QR Code</h3>
            <p class="text-[11px] text-gray-400 mb-3">Adjust box to focus closely on the QR code.</p>
            
            <div class="max-h-64 overflow-hidden bg-black rounded-xl flex justify-center items-center">
                <img id="imageToCrop" src="" class="max-w-full">
            </div>
            
            <div class="flex gap-2 mt-4">
                <button onclick="closeCropper()" class="w-1/2 bg-gray-800 hover:bg-gray-700 py-2.5 rounded-xl text-xs font-bold transition">Cancel</button>
                <button onclick="performCroppedScan()" class="w-1/2 bg-red-600 hover:bg-red-700 py-2.5 rounded-xl text-xs font-bold transition">Crop & Scan</button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDDY_v7RHnkCTI6uyV4DNDjqoaIBGweg8c",
          authDomain: "digital-a2552.firebaseapp.com",
          projectId: "digital-a2552",
          storageBucket: "digital-a2552.firebasestorage.app",
          messagingSenderId: "218135618179",
          appId: "1:218135618179:web:821b76920d3e5669ac31b6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const CURRENT_USER_ID = localStorage.getItem('my_unique_userid'] || "user_" + Math.random().toString(36).substring(2, 8);
        localStorage.setItem('my_unique_userid', CURRENT_USER_ID);

        let html5QrCode = null;
        let lastGeneratedToken = "";
        let cropperInstance = null;
        let torchOn = false;

        // Load Profile Details from localStorage if available
        window.onload = function() {
            const savedName = localStorage.getItem('user_profile_name') || "Kamal G.C.";
            const savedPhone = localStorage.getItem('user_profile_phone') || "+977 9800000000";
            const savedEmail = localStorage.getItem('user_profile_email') || "kamal@gmail.com";

            document.getElementById('profileName').textContent = savedName;
            document.getElementById('profilePhone').textContent = savedPhone;
            document.getElementById('profileEmail').textContent = savedEmail;

            generateSecureQRToken();
        };

        // Tab Switching Logic (Scan / Share)
        window.switchTab = function(tab) {
            const scanTabBtn = document.getElementById('scanTabBtn');
            const shareTabBtn = document.getElementById('shareTabBtn');
            const scanView = document.getElementById('scanView');
            const shareView = document.getElementById('shareView');

            if (tab === 'scan') {
                scanTabBtn.className = "flex-1 py-2.5 rounded-lg font-bold text-sm transition text-red-500 bg-white shadow";
                shareTabBtn.className = "flex-1 py-2.5 rounded-lg font-bold text-sm transition text-gray-400";
                scanView.classList.remove('hidden');
                shareView.classList.add('hidden');
            } else {
                shareTabBtn.className = "flex-1 py-2.5 rounded-lg font-bold text-sm transition text-red-500 bg-white shadow";
                scanTabBtn.className = "flex-1 py-2.5 rounded-lg font-bold text-sm transition text-gray-400";
                shareView.classList.remove('hidden');
                scanView.classList.add('hidden');
                stopRealScanner();
            }
        };

        // Generate Secure QR Token
        function generateSecureQRToken() {
            const qrcodeContainer = document.getElementById('qrcode');
            if (!qrcodeContainer) return;
            qrcodeContainer.innerHTML = ""; 
            
            const uniqueHash = Math.random().toString(36).substring(2, 8);
            const secureToken = `LEDGER_SYNC_${CURRENT_USER_ID}_${Date.now()}_${uniqueHash}`;
            lastGeneratedToken = secureToken;

            if (typeof QRCode !== 'undefined') {
                new QRCode(qrcodeContainer, {
                    text: secureToken,
                    width: 160,
                    height: 160,
                    correctLevel: QRCode.CorrectLevel.H
                });
            }
        }

        // Native Share Sheet Trigger (Step 4)
        window.openNativeShareSheet = async function() {
            if (!lastGeneratedToken) generateSecureQRToken();

            const profileName = document.getElementById('profileName').textContent;
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'Family Ledger QR Sync',
                        text: `Hello! Link and sync ledger account for ${profileName} using secure token: ${lastGeneratedToken}`
                    });
                } catch (err) {
                    console.log('Share canceled', err);
                }
            } else {
                try {
                    await navigator.clipboard.writeText(lastGeneratedToken);
                    showFeedback("Token copied to clipboard!", "success");
                } catch (err) {
                    showFeedback("Sharing failed!", "error");
                }
            }
        };

        // Cloud Restore / Sync
        window.restoreFromCloud = async function(userIdToFetch) {
            try {
                const dbRef = ref(db);
                const snapshot = await get(child(dbRef, `users/${userIdToFetch}`));
                
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    if (data.notes) localStorage.setItem('advanced_notebook_notes', JSON.stringify(data.notes));
                    if (data.theme) localStorage.setItem('theme', data.theme);
                    return { success: true, message: "Synced successfully!" };
                } else {
                    return { success: false, message: "No cloud backup found!" };
                }
            } catch (error) {
                return { success: false, message: error.message };
            }
        };

        // Handle Scan Success
        function handleScanSuccess(text) {
            if (typeof text !== 'string') return;

            if (text.startsWith("LEDGER_SYNC_")) {
                const parts = text.split("_");
                if (parts.length >= 3) {
                    const targetUserId = parts[2];
                    const tokenTimestamp = parseInt(parts[3], 10);
                    const timeDifference = (Date.now() - tokenTimestamp) / 1000;

                    if (timeDifference > 120 || timeDifference < 0) {
                        playBeep(false);
                        showFeedback("QR code expired! Request a new one.", "error");
                        return;
                    }

                    if (navigator.vibrate) navigator.vibrate(200);
                    playBeep(true);

                    localStorage.setItem("linked_ledger_user_id", targetUserId);
                    showFeedback("Account linked! Loading data...", "success");

                    window.restoreFromCloud(targetUserId).then(res => {
                        if (res.success) {
                            alert("Ledger account successfully synced to your device!");
                            location.reload();
                        } else {
                            showFeedback(res.message, "error");
                        }
                    });
                    return;
                }
            }
            playBeep(false);
            showFeedback("Invalid QR code format!", "error");
        }

        // Gallery File Selection & Cropper
        window.scanImageFromFile = function(e) {
            if (!e.target.files || e.target.files.length === 0) return;
            const imageFile = e.target.files[0];

            const reader = new FileReader();
            reader.onload = function(event) {
                const imgElement = document.getElementById('imageToCrop');
                imgElement.src = event.target.result;
                
                document.getElementById('cropperModal').style.display = 'flex';

                if (cropperInstance) cropperInstance.destroy();

                cropperInstance = new Cropper(imgElement, {
                    aspectRatio: 1,
                    viewMode: 1,
                    autoCropArea: 0.8,
                    responsive: true
                });
            };
            reader.readAsDataURL(imageFile);
        };

        window.closeCropper = function() {
            document.getElementById('cropperModal').style.display = 'none';
            if (cropperInstance) {
                cropperInstance.destroy();
                cropperInstance = null;
            }
            document.getElementById('fileInput').value = '';
        };

        window.performCroppedScan = function() {
            if (!cropperInstance) return;

            const croppedCanvas = cropperInstance.getCroppedCanvas({ width: 500, height: 500, fillColor: '#fff' });

            croppedCanvas.toBlob((blob) => {
                closeCropper();
                
                const html5QrCodeFromFile = new Html5Qrcode("reader");
                html5QrCodeFromFile.scanFile(blob, true)
                    .then(decodedText => { handleScanSuccess(decodedText); })
                    .catch(err => { showFeedback("No valid QR found in cropped area!", "error"); });
            }, 'image/png');
        };

        // Flashlight / Torch toggle
        window.toggleTorch = function() {
            if (!html5QrCode || !html5QrCode.isScanning) {
                showFeedback("Start camera first to use flash!", "error");
                return;
            }
            torchOn = !torchOn;
            html5QrCode.applyVideoConstraints({ advanced: [{ torch: torchOn }] })
                .catch(err => console.log("Torch error", err));
        };

        // Camera Scanner Controls
        window.startRealScanner = function() {
            const placeholder = document.getElementById('scannerPlaceholder');
            const spinner = document.getElementById('scannerLoading');
            if (spinner) spinner.classList.remove('hidden');
            if (placeholder) placeholder.style.display = 'none';
            
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 180, height: 180 } },
                (decodedText) => {
                    if (spinner) spinner.classList.add('hidden');
                    handleScanSuccess(decodedText);
                    stopRealScanner();
                },
                () => {}
            ).catch((err) => {
                if (spinner) spinner.classList.add('hidden');
                showFeedback("Camera permission denied!", "error");
                if (placeholder) placeholder.style.display = 'flex';
            });
        };

        window.stopRealScanner = function() {
            const spinner = document.getElementById('scannerLoading');
            if (spinner) spinner.classList.add('hidden');

            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    const placeholder = document.getElementById('scannerPlaceholder');
                    if (placeholder) placeholder.style.display = 'flex';
                }).catch(err => {});
            }
        };

        // Audio Beep
        function playBeep(isSuccess) {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const audioCtx = new AudioContext();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = isSuccess ? 'sine' : 'sawtooth';
                oscillator.frequency.setValueAtTime(isSuccess ? 880 : 300, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + (isSuccess ? 0.15 : 0.3));
            } catch (e) {}
        }

        // Toast Feedback Message
        function showFeedback(message, type) {
            const fb = document.getElementById('feedbackMsg');
            if (!fb) return;
            
            fb.className = `fixed top-4 left-1/2 transform -translate-x-1/2 z-50 px-4 py-2 rounded-xl text-xs font-bold shadow-lg transition-all ${type === 'success' ? 'bg-emerald-600 text-white' : 'bg-red-600 text-white'}`;
            fb.textContent = message;
            fb.classList.remove('hidden');

            setTimeout(() => { fb.classList.add('hidden'); }, 3000);
        }
    </script>
</body>
</html>
